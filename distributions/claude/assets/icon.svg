<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BIOME Ecosystem Logo">
  <!-- BIOME: Autonomous Multi-Agent Engineering Ecosystem -->
  <!-- Elephant (Memory: Blue) · Goldfish (Audit: Amber) · Beaver (Build: Green) · Woodpecker (Security: Crimson) -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Elephant (North / Memory & Architectural Spec) -->
    <path d="M 32 4 C 37 4 45 10 42 22 C 39 25 35 26 32 26 C 29 26 25 25 22 22 C 19 10 27 4 32 4 Z" fill="url(#blueGrad)"/>

    <!-- Goldfish (East / Zero-Context Audit & Indexing) -->
    <path d="M 60 32 C 60 37 54 45 42 42 C 39 39 38 35 38 32 C 38 29 39 25 42 22 C 54 19 60 27 60 32 Z" fill="url(#amberGrad)"/>

    <!-- Beaver (South / Surgical Build & Micro-Architecture) -->
    <path d="M 32 60 C 27 60 19 54 22 42 C 25 39 29 38 32 38 C 35 38 39 39 42 42 C 45 54 37 60 32 60 Z" fill="url(#greenGrad)"/>

    <!-- Woodpecker (West / Raw Code Diff & Security Audit) -->
    <path d="M 4 32 C 4 27 10 19 22 22 C 25 25 26 29 26 32 C 26 35 25 39 22 42 C 10 45 4 37 4 32 Z" fill="url(#redGrad)"/>

    <!-- Central Nexus Core (The Ecosystem Equilibrium) -->
    <circle cx="32" cy="32" r="7.5" fill="#0F172A"/>
    <circle cx="32" cy="32" r="4.5" fill="#38BDF8"/>
    <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
  </g>
</svg>
