<svg xmlns="http://www.w3.org/2000/svg" width="480" height="126" viewBox="0 0 480 126" role="img" aria-labelledby="title">
  <title id="title">BIOME Ecosystem</title>
  <defs>
    <linearGradient id="hBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="hAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="hGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <style>
    .brand-title { fill: #0f172a; }
    .brand-subtitle { fill: #475569; }
    .nexus-outer { fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .brand-title { fill: #f8fafc; }
      .brand-subtitle { fill: #94a3b8; }
      .nexus-outer { fill: #1e293b; }
    }
  </style>

  <!-- 4-Animal Ecosystem Emblem (Centered at x: 240, y: 32) -->
  <g transform="translate(240, 32) scale(0.85)" filter="url(#hGlow)">
    <!-- Elephant (North / Memory: Blue) -->
    <path d="M 0 -28 C 5 -28 13 -22 10 -10 C 7 -7 3 -6 0 -6 C -3 -6 -7 -7 -10 -10 C -13 -22 -5 -28 0 -28 Z" fill="url(#hBlue)"/>
    <!-- Goldfish (East / Audit: Amber) -->
    <path d="M 28 0 C 28 5 22 13 10 10 C 7 7 6 3 6 0 C 6 -3 7 -7 10 -10 C 22 -13 28 -5 28 0 Z" fill="url(#hAmber)"/>
    <!-- Beaver (South / Build: Green) -->
    <path d="M 0 28 C -5 28 -13 22 -10 10 C -7 7 -3 6 0 6 C 3 6 7 7 10 10 C 13 22 5 28 0 28 Z" fill="url(#hGreen)"/>
    <!-- Woodpecker (West / Security: Crimson) -->
    <path d="M -28 0 C -28 -5 -22 -13 -10 -10 C -7 -7 -6 -3 -6 0 C -6 3 -7 7 -10 10 C -22 13 -28 5 -28 0 Z" fill="url(#hRed)"/>
    <!-- Central Equilibrium Nexus -->
    <circle cx="0" cy="0" r="7.5" class="nexus-outer"/>
    <circle cx="0" cy="0" r="4.5" fill="#38BDF8"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography -->
  <text class="brand-title" x="240" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="4">BIOME</text>
  <text class="brand-subtitle" x="240" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.2">AUTONOMOUS MULTI-AGENT ENGINEERING ECOSYSTEM</text>
</svg>
