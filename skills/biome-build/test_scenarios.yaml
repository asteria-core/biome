skill: "biome-build"
description: "Behavioral evaluation scenario suite for BIOME Beaver Build standalone skill."

scenarios:
  - scenario_id: "biome_build_standalone_execution"
    description: "Verifies /biome-build executes code modifications from project_index.json."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/biome-build/SKILL.md"
    turns:
      - user_input: "Run /biome-build docs/designs/auth.md"
        assertions:
          - type: "required_pattern"
            pattern: "(receipt|Mutations Executed|Git Commit)"
            message: "BIOME Beaver Build must return an execution receipt."
