skill: "biome-critic"
description: "Behavioral evaluation scenario suite for BIOME Critic standalone skill."

scenarios:
  - scenario_id: "biome_critic_standalone_audit"
    description: "Verifies /biome-critic performs adversarial audit on a design doc."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/biome-critic/SKILL.md"
    turns:
      - user_input: "Run /biome-critic docs/designs/auth.md"
        assertions:
          - type: "required_pattern"
            pattern: "(Critic|audit|UI/UX|flaw|Blocker|Major)"
            message: "BIOME Critic must perform adversarial analysis."
