skill: "biome-cartographer"
description: "Behavioral evaluation scenario suite for BIOME Cartographer topology mapper."

scenarios:
  - scenario_id: "biome_cartographer_mapping"
    description: "Verifies /biome-cartographer maps codebase topology."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/biome-cartographer/SKILL.md"
    turns:
      - user_input: "Run /biome-cartographer"
        assertions:
          - type: "required_pattern"
            pattern: "(Cartographer|topology|codebase_topology|modules)"
            message: "BIOME Cartographer must emit topology mapping."
