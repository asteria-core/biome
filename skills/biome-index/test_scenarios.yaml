skill: "biome-index"
description: "Behavioral evaluation scenario suite for BIOME Indexer standalone skill."

scenarios:
  - scenario_id: "biome_indexer_standalone_generation"
    description: "Verifies /biome-index generates .biome/project_index.json from spec."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/biome-index/SKILL.md"
    turns:
      - user_input: "Run /biome-index docs/designs/auth.md"
        assertions:
          - type: "required_pattern"
            pattern: "(project_index\\.json|target_mutation_plan|tech_stack)"
            message: "BIOME Indexer must produce or reference project_index.json."
